project_id = "na-real"
[functions.moderate-pending]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.delete-photo]
verify_jwt = false

[functions.prepare-photo]
verify_jwt = false

# Development services only; hosted settings must be configured separately.
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["nareal://auth-callback", "http://127.0.0.1:8081/auth-callback"]
minimum_password_length = 8
[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1s"
[analytics]
enabled = false

# Templates locais. O projeto hospedado precisa ser configurado separadamente.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no NA REAL"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Recupere seu acesso ao NA REAL"
content_path = "./supabase/templates/recovery.html"
